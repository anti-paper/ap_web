services:
  web:
    image: nginx:alpine
    tty: true
    ports:
      - ${APP_PORT:-80}:80
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/auth/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - app
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    tty: true
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: postgres:16
    tty: true
    environment:
      POSTGRES_DB: ${DB_NAME:-db}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-pass}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - ${DB_PORT:-5432}:5432
volumes:
  db-data:
